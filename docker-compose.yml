services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
      POSTGRES_DB: concert
    ports:
      - "5432:5432"          # để chạy API/test trực tiếp trên máy với cùng DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert -d concert"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://concert:concert@db:5432/concert
      JWT_SECRET: change-me-in-production-at-least-32-bytes-long
      # Cổng thanh toán lấy từ .env ở thư mục gốc (docker compose tự đọc file này để thay ${...}).
      # Sandbox: PAYMENT_PROVIDER=vnpay (hoặc vnpay,mock để khách chọn cổng) và điền VNPAY_* trong .env.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-me-payment-webhook-secret}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      TICKET_QR_SECRET: change-me-ticket-qr-secret
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
