<!doctype html>

    <a class="skip-link" href="#main">Đến nội dung chính</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" aria-label="HIT THE VIBE — Trang chủ">
          <span class="brand-mark" aria-hidden="true">♫</span>
          <span><span class="brand-name">HIT THE VIBE</span><span class="brand-caption">Âm nhạc. Gặp gỡ. Kỷ niệm.</span></span>
